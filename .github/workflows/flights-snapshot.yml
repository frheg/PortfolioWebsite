# Live flights for Explore: OpenSky snapshot → relay Worker every ~5 min (GitHub cron is best-effort, often late).
# Secrets: OPENSKY_CLIENT_ID, OPENSKY_CLIENT_SECRET, SNAPSHOT_KEY (same value as the Worker secret).
name: Flights snapshot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flights-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch + push snapshot
        run: node scripts/flights-snapshot.mjs
        env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
          SNAPSHOT_KEY: ${{ secrets.SNAPSHOT_KEY }}
          RELAY_URL: ${{ vars.VITE_RELAY_URL || 'https://space-relay.space-relay.workers.dev' }}
