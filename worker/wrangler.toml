# space-relay — deploy: cd worker && npx wrangler login && npx wrangler deploy
name = "space-relay"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
# Exact origins, or ".suffix" host match (tailnet dev).
ALLOWED_ORIGINS = "https://fredrichegland.no,https://www.fredrichegland.no,http://localhost:5173,http://kratos:5173,.ts.net"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# Free plan: SQLite-backed Durable Objects only.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Flights"]

# Flights relay removed → delete the DO class + its stored snapshot.
[[migrations]]
tag = "v3"
deleted_classes = ["Flights"]
